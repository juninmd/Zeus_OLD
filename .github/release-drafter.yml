name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels: [feature, enhancement]
  - title: '🐛 Bug Fixes'
    labels: [fix, bug]
  - title: '🛡️ Security'
    labels: [security]
  - title: '⬆️ Dependencies'
    labels: [dependencies]
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
version-resolver:
  major: { labels: [major, breaking] }
  minor: { labels: [minor, feature, enhancement] }
  patch: { labels: [patch, fix, bug, dependencies] }
  default: patch
template: |
  ## Changes
  $CHANGES
